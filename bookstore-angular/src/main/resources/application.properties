server.address=${HOST:127.0.0.1}
server.port=${PORT:8181}
spring.datasource.url=${BOOKSTORE_DB_URL:jdbc:h2:file:./.data/bookstore;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${BOOKSTORE_DB_USER:sa}
spring.datasource.password=${BOOKSTORE_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jackson.serialization.fail-on-empty-beans=false
server.error.include-message=always
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
bookstore.seed-demo=${BOOKSTORE_DEMO:true}
bookstore.demo-student-password=${BOOKSTORE_STUDENT_PASSWORD:student-demo-only}
bookstore.demo-admin-password=${BOOKSTORE_ADMIN_PASSWORD:admin-demo-only}
bookstore.price-url-template=${BOOKSTORE_PRICE_URL_TEMPLATE:}
bookstore.upload-dir=${BOOKSTORE_UPLOAD_DIR:.data/uploads}
