name: Verify bookstore
on: [push, pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./run.sh build
      - run: node --check bookstore-angular/src/main/resources/static/app.js
      - name: Exercise the packaged HTTP application
        run: |
          java -jar bookstore-angular/target/bookstore-angular-1.0.0.jar > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl --silent --fail http://127.0.0.1:8181/ >/dev/null; then break; fi
            sleep 1
          done
          python3 scripts/http_smoke.py
